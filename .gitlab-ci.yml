stages: 
    - build
    - test
    - report
build:
    stage: build
    image: alpine:3.20
    script:
        - echo "hello" > info.txt
        - echo "building"
    
    artifacts:
        paths:
            - info.txt


run-tests:
    stage: test
    image: python:3.12
    script:
        - pip install pytest
        - pytest
        - echo "testing"

report:
    stage: report
    image: alpine:3.20
    script:
        - echo "reporting"
        - cat info.txt