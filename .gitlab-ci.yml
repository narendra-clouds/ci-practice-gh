stages: 
    - build
    - test
    - report

build:
    stage: build
    image: alpine:3.20
    script:
        - echo "hello, form Narendra i am learning CiCd form claude thank you claude !" > info.txt
        - echo "building"
    artifacts:
        paths:
            - info.txt
 

variables:
      path: "PIP_CACHE_DIR/.pip-cache"

run-tests:

    stage: test
    image: python:3.12
    script:
        - pip install pytest
        - pytest
        - echo "testing"
    cache:
        path:
            - .pip-cache/

report:
    stage: report
    image: alpine:3.20
    script:
        - echo "reporting"
        - cat info.txt