stages: 
    - build
    - test
    - push
    - report


job-build:
    stage: build
    image: alpine:3.20
    script:
        - echo "hello, i am Narendra !" > info.txt
        - echo "building"
    artifacts:
        paths:
            - info.txt
 


variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"


job-tests:
    stage: test
    image: python:3.12
    script:
        - pip install pytest
        - pytest
        - echo "testing"
    cache:
        paths:
            - .pip-cache/



job-push:
    stage: push
    image: docker:27
    services:
        - docker:27-dind
    script:
        - echo "pushing to repo"
        - echo "828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA"
        - apk add --no-cache aws-cli
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 828538001703.dkr.ecr.eu-north-1.amazonaws.com
        - docker build -t 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA .
        - docker push 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA
        - docker images 


job-report:
    stage: report
    image: alpine:3.20
    script:
        - echo "reporting"
        - cat info.txt
        - echo "Hello form feature-test branch = $MY_NAME"