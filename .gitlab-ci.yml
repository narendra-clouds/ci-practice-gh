stages: 
    - test
    - build
    - push
    - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

job-test:
  stage: test
  image: python:3.12
  script:
    - pip install pytest
    - pytest
    - echo "test complete"
  cache:
    paths:
      - .pip-cache/


job-build:
  stage: build
  image: python:3.12
  script:
    - echo "I am building but no real purpose just for practice !"
    - echo "build complete"
  


job-push:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  script:
    - echo "pushing to ecr"
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 828538001703.dkr.ecr.eu-north-1.amazonaws.com
    - docker build -t 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA .
    - docker push 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA
    - echo "push complete"


job-deploy:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "deploying to docker"
    - apk add --no-cache openssh-client
    - chmod 600 $SSH_PRIVATE_KEY
    - ssh -i $SSH_PRIVATE_KEY -o StrictHostKeyChecking=accept-new ec2-user@$EC2_HOST "docker pull 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA && (docker rm -f ci-practice || true) && docker run -d --name ci-practice -p 5000:5000 828538001703.dkr.ecr.eu-north-1.amazonaws.com/ci-practice:$CI_COMMIT_SHORT_SHA && docker ps && curl -f --retry 5 --retry-delay 2 --retry-all-errors http://localhost:5000/health"
    - echo "deploy complete"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
